<html lang="en">
  <head>

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />

      content="50-engineer studio building startups, MVPs, AI agents, voice agents, automation and custom ML."

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://truecodeai.com/#org",
            "name": "TrueCodeAI",
            "url": "https://truecodeai.com/",
            "logo": "https://truecodeai.com/og.png",
            "email": "hello@truecodeai.com",
            "telephone": "+91-9716978692",
            "description": "A 50-engineer software studio that builds startups, MVPs, AI agents, voice agents, automation and custom ML models.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Nashik",
              "addressRegion": "Maharashtra",
              "addressCountry": "IN"
            },
            "priceRange": "$$",
            "areaServed": "Worldwide",
            "numberOfEmployees": { "@type": "QuantitativeValue", "minValue": 50 },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+91-9716978692",
              "email": "hello@truecodeai.com",
              "url": "https://truecodeai.com/#contact",
              "availableLanguage": ["en", "hi"]
            },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Startup product development, end to end" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Production-grade MVP development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom business software solutions" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI agent development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Voice agent development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI automation" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom ML model training" } }
              ]
            },
            "knowsAbout": [
              "Software development",
              "AI agents",
              "Voice agents",
              "Machine learning",
              "MVP development",
              "Cloud architecture",
              "DevOps",
              "Web3",
              "Cybersecurity"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://truecodeai.com/#website",
            "url": "https://truecodeai.com/",
            "name": "TrueCodeAI",
            "publisher": { "@id": "https://truecodeai.com/#org" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- fonts load without blocking first paint; text renders in the system fallback and swaps in -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

      <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet"
